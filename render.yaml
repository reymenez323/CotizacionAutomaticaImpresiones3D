services:
  - type: web
    name: prototiposrd-cotizador-3d
    env: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/debug-info
    envVars:
      - key: PRUSASLICER_PATH
        value: /usr/bin/prusa-slicer

      - key: DATABASE_PATH
        value: /app/data/prototiposrd.db
      - key: UPLOAD_DIR
        value: /app/data/uploads
      - key: ADMIN_PASSWORD
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: ADMIN_NOTIFICATION_EMAIL
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
